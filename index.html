<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подборка ЖК</title></head>
<body><script>
(function () {
  var q = new URLSearchParams(location.search), v = q.get('variant'), k = 'zk_variant';
  if (v !== 'current' && v !== 'target') {
    try { v = localStorage.getItem(k); } catch (e) {}
    if (v !== 'current' && v !== 'target') { v = Math.random() < 0.5 ? 'current' : 'target'; try { localStorage.setItem(k, v); } catch (e) {} }
    q.set('assign', 'random');
  }
  q.delete('variant');
  var s = q.toString();
  location.replace((v === 'current' ? 'current.html' : 'celevoy.html') + (s ? '?' + s : '') + location.hash);
})();
</script></body></html>
